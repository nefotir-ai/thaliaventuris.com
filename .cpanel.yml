---
# thaliaventuris.com is the PRIMARY domain on the thalwyas cPanel account,
# so its live document root is /home/thalwyas/public_html/ directly (not
# a domain-named subfolder, unlike the nefotir.ai/nefotir.com addon-domain
# setup).
#
# STAGING vs PRODUCTION: toggle which DEPLOYPATH line is active below.
# Only one "export DEPLOYPATH=" line should be uncommented at a time.
# Switching to the public_html line and deploying is the real production
# cutover — it overwrites the live Sitejet-served site immediately.
deployment:
  tasks:
    # - export DEPLOYPATH=/home/thalwyas/staging.thaliaventuris.com/
    - export DEPLOYPATH=/home/thalwyas/public_html/
    - /bin/cp -R index.html Growth Contacts News-and-Insights At-a-Glance assets contact-handler.php $DEPLOYPATH
    # Leftover Sitejet index.php takes priority over our index.html in the
    # server's default DirectoryIndex order, so "/" kept serving the old
    # site even after our files were deployed. -f so this is a harmless
    # no-op on staging, which never had one.
    - /bin/rm -f $DEPLOYPATH/index.php
